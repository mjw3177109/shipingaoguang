name: Backend CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py collectstatic --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --verbosity 2
      - run: python -m compileall -q highlights
      - run: python -m highlights.vision.evaluate --proposals benchmarks/example_proposals.json --truth benchmarks/example_truth.json --out /tmp/basketcut-ci-single
      - run: python -m highlights.vision.batch --manifest benchmarks/example_manifest.json --out /tmp/basketcut-ci-batch
