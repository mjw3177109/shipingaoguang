name: Free CPU Pretrained Ball Model Comparison
on:
  workflow_dispatch:
  push:
    branches: [feat/cpu-free-throw-validation]
    paths:
      - "highlights/vision/cpu_pretrained.py"
      - ".github/workflows/cpu-pretrained-benchmark.yml"
jobs:
  pretrained-model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyTorch CPU wheels and OpenCV
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -r requirements-cpu.txt
          python - <<'PY'
          import torch, torchvision
          print("Torch:", torch.__version__, "Torchvision:", torchvision.__version__)
          assert not torch.cuda.is_available() or True  # Device is forced to CPU in code.
          PY
      - name: Download CC licensed real clips
        run: |
          mkdir -p /tmp/basketcut-learned
          curl -fL --retry 3 --max-time 110 \
            "https://upload.wikimedia.org/wikipedia/commons/2/2d/Basketpass.webm" \
            -o /tmp/basketcut-learned/passing.webm
          curl -fL --retry 3 --max-time 110 \
            "https://upload.wikimedia.org/wikipedia/commons/f/f1/VCB_FCB%284%29.webm" \
            -o /tmp/basketcut-learned/free_throw.webm
      - name: Actual free CPU pretrained-model comparison
        run: |
          python -m highlights.vision.cpu_pretrained \
            --video /tmp/basketcut-learned/passing.webm \
            --out /tmp/basketcut-learned/passing_model.json --interval 0.8 --max-frames 12
          python -m highlights.vision.cpu_pretrained \
            --video /tmp/basketcut-learned/free_throw.webm \
            --out /tmp/basketcut-learned/free_throw_model.json --interval 0.8 --max-frames 12
          # Additional experiments: enlarge distant balls with 4 overlapping tiles.
          python -m highlights.vision.cpu_pretrained \
            --video /tmp/basketcut-learned/free_throw.webm \
            --out /tmp/basketcut-learned/free_throw_mobile_tiled.json \
            --interval 0.8 --max-frames 12 --tiles 4 --threshold 0.08
          python -m highlights.vision.cpu_pretrained \
            --video /tmp/basketcut-learned/free_throw.webm \
            --out /tmp/basketcut-learned/free_throw_resnet50.json \
            --interval 1.0 --max-frames 8 --arch resnet50 --threshold 0.1
          python -m highlights.vision.cpu_pretrained \
            --video /tmp/basketcut-learned/free_throw.webm \
            --out /tmp/basketcut-learned/free_throw_hoop_roi.json \
            --config benchmarks/free_throw_estimated_roi.json \
            --interval 0.8 --max-frames 12 --arch mobile320 --tiles 4 --threshold 0.08
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('passing_model','free_throw_model','free_throw_mobile_tiled','free_throw_resnet50','free_throw_hoop_roi'):
              data=json.loads(Path(f"/tmp/basketcut-learned/{name}.json").read_text())
              print(f"{name}: ball detections={data['analysis']['ball_detections']}, "
                    f"candidate clips={len(data['candidates'])}, "
                    f"CPU seconds={data['analysis']['elapsed_seconds']}")
          PY
      - name: Publish metadata only (no raw video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-cpu-pretrained-results
          path: |
            /tmp/basketcut-learned/*_model.json
            /tmp/basketcut-learned/free_throw_mobile_tiled.json
            /tmp/basketcut-learned/free_throw_resnet50.json
            /tmp/basketcut-learned/free_throw_hoop_roi.json
          retention-days: 7
          if-no-files-found: warn
