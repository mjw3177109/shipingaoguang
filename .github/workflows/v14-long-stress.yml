name: BasketCut V1.4 Long Recording Stress - CPU 60 Minute

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "highlights/vision/cpu.py"
      - "highlights/test_v14_long.py"
      - "scripts/v14_*.py"
      - ".github/workflows/v14-long-stress.yml"
      - "docs/V14_LONG_RECORDING_ACCEPTANCE.md"
  push:
    branches: [main]
    paths:
      - "highlights/vision/cpu.py"
      - "highlights/test_v14_long.py"
      - "scripts/v14_*.py"
      - ".github/workflows/v14-long-stress.yml"

jobs:
  long-recording:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEBUG: "1"
      SECRET_KEY: "v14-temporary-isolated-ci"
      DATABASE_URL: "sqlite:////tmp/basketcut-v14/db.sqlite3"
      MEDIA_ROOT: "/tmp/basketcut-v14/media"
      MEDIA_MIN_FREE_BYTES: "0"
      MAX_UPLOAD_BYTES: "536870912"
      BASKETCUT_V14_ISOLATED: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and CPU-only dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt -r requirements-cpu.txt
      - name: Initialize disposable database and isolated volumes
        run: |
          mkdir -p /tmp/basketcut-v14/media /tmp/basketcut-v14/out
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
          python manage.py test highlights.test_v14_long highlights.test_v13_diagnostics --verbosity 2
      - name: Download CC0 REAL basketball SHORT clip
        run: |
          curl -fL --retry 3 --connect-timeout 20 --max-time 120 \
            "https://upload.wikimedia.org/wikipedia/commons/2/2d/Basketpass.webm" \
            -o /tmp/basketcut-v14/Basketpass.webm
          test "$(stat -c%s /tmp/basketcut-v14/Basketpass.webm)" -gt 100000
      - name: Create one-hour engineering stress fixture (REPEATED real footage)
        run: |
          python scripts/v14_make_long_fixture.py \
            --source /tmp/basketcut-v14/Basketpass.webm \
            --out /tmp/basketcut-v14/out/input_long.mp4 \
            --seconds 3600 \
            --source-url "https://commons.wikimedia.org/wiki/File:Basketpass.webm" \
            --license "CC0 1.0 - Benoît Prieur"
      - name: Execute streaming storage, complete CPU Worker scan, FFmpeg and lease recovery
        run: |
          python scripts/v14_long_stress.py \
            --video /tmp/basketcut-v14/out/input_long.mp4 \
            --out /tmp/basketcut-v14/out \
            --kind fixture \
            --source-url "https://commons.wikimedia.org/wiki/File:Basketpass.webm" \
            --license "CC0 1.0 - Benoît Prieur" \
            --confirm-isolated
      - name: Enforce machine-auditable long-duration thresholds
        run: |
          python scripts/v14_acceptance.py \
            --out /tmp/basketcut-v14/out \
            --max-elapsed-seconds 1800 --max-rss-mib 2048
      - name: Package changed-only V1.4 source patch
        if: always()
        run: |
          mkdir -p /tmp/basketcut-v14/source_patch
          for file in \
            highlights/vision/cpu.py \
            highlights/management/commands/runworker.py \
            highlights/test_v14_long.py \
            scripts/v14_make_long_fixture.py \
            scripts/v14_long_stress.py \
            scripts/v14_acceptance.py \
            .github/workflows/v14-long-stress.yml \
            docs/V14_LONG_RECORDING_ACCEPTANCE.md; do
            mkdir -p "/tmp/basketcut-v14/source_patch/$(dirname "$file")"
            cp "$file" "/tmp/basketcut-v14/source_patch/$file"
          done
          printf '%s\n' \
            '# BasketCut V1.4 增量补丁' \
            '' \
            '基础版本：V1.3 main；文件均按仓库根目录的相对路径放置。' \
            '修改：highlights/vision/cpu.py、highlights/management/commands/runworker.py。' \
            '其余 6 个为新增文件；不包括用户数据、录像或已有其他版本代码。' \
            '安装后参考 docs/V14_LONG_RECORDING_ACCEPTANCE.md，并执行 python manage.py test highlights.test_v14_long。' \
            '注意：CI 仅验证循环 60 分钟工程视频，不宣称真实完整比赛准确率。' \
            > /tmp/basketcut-v14/source_patch/INSTALL_V14.md
          cd /tmp/basketcut-v14/source_patch
          zip -q -r /tmp/basketcut-v14/BasketCut_V1_4_PATCH.zip .
      - name: Upload changed-only source patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basketcut-v14-patch-only
          retention-days: 7
          path: /tmp/basketcut-v14/BasketCut_V1_4_PATCH.zip
          if-no-files-found: warn
      - name: Retain honest JSON and render evidence, not entire footage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basketcut-v14-60m-looped-cc0-cpu-stress-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            /tmp/basketcut-v14/out/v14_fixture_manifest.json
            /tmp/basketcut-v14/out/v14_stress_report.json
            /tmp/basketcut-v14/out/v14_stress_failure.json
            /tmp/basketcut-v14/out/v14_acceptance.json
            /tmp/basketcut-v14/out/highlight.mp4
