name: BasketCut V1.6 Reverse Proxy Transport and Real Match Admission Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/v16_proxy_probe.py"
      - "highlights/vision/real_match_gate_v16.py"
      - "highlights/test_v16_real_match_gate.py"
      - ".github/workflows/v16-reverse-proxy-and-game-admission.yml"
      - "docs/V16_PRODUCTION_ACCEPTANCE.md"
      - "deploy/nginx/basketcut_upload.example.conf"
  push:
    branches: [main]
    paths:
      - "scripts/v16_proxy_probe.py"
      - "highlights/vision/real_match_gate_v16.py"
      - "highlights/test_v16_real_match_gate.py"
      - ".github/workflows/v16-reverse-proxy-and-game-admission.yml"
      - "deploy/nginx/basketcut_upload.example.conf"

jobs:
  reverse-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DEBUG: "1"
      SECRET_KEY: "only-for-v16-temporary-github-actions"
      DATABASE_URL: "sqlite:////tmp/basketcut-v16/db.sqlite3"
      MEDIA_ROOT: "/tmp/basketcut-v16/media"
      MEDIA_MIN_FREE_BYTES: "0"
      MAX_UPLOAD_BYTES: "50331648"
      OWNER_MAX_RAW_BYTES: "134217728"
      BASKETCUT_V16_ISOLATED: "YES"
      TMPDIR: "/tmp/basketcut-v16/out/django_temp"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install actual Nginx FFmpeg and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx ffmpeg
          python -m pip install -r requirements.txt -r requirements-cpu.txt
      - name: Prepare isolated database, real decoder core, padded 40 MiB transport
        run: |
          mkdir -p /tmp/basketcut-v16/media /tmp/basketcut-v16/out/django_temp
          python manage.py migrate --noinput
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=s=960x540:r=30" -t 25 \
            -c:v libx264 -preset veryfast -crf 17 -pix_fmt yuv420p -movflags +faststart \
            /tmp/basketcut-v16/original.mp4
          python - <<'PY'
          from pathlib import Path
          p=Path("/tmp/basketcut-v16/original.mp4")
          original=p.stat().st_size
          assert 200000 < original < 40 * 1024**2
          with p.open("ab") as f:
              f.truncate(40 * 1024**2)
          assert p.stat().st_size == 40 * 1024**2
          PY
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1 /tmp/basketcut-v16/original.mp4
      - name: Test actual Nginx -> Gunicorn streaming multipart SHA and 413 guards
        run: |
          python scripts/v16_proxy_probe.py \
            --video /tmp/basketcut-v16/original.mp4 \
            --out /tmp/basketcut-v16/out \
            --minimum-bytes 33554432
      - name: Strict verify measured reverse-proxy result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/basketcut-v16/out/v16_proxy_report.json").read_text())
          assert r["result"]=="PASS"
          assert r["transport"]=="real_localhost_nginx_to_gunicorn_to_django"
          assert r["source_and_stored_sha256_equal"]
          assert r["input_bytes"] >= 40*1024**2
          assert r["http_status"]==302
          assert r["early_django_413"] and r["early_nginx_413"]
          assert r["temp_sample_count"] > 0
          assert not r["proxy_uses_tls"]
          assert not r["large_2_to_4_gib_tested"]
          PY
      - name: Upload strictly scoped engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basketcut-v16-real-nginx-40mib-transport
          retention-days: 7
          if-no-files-found: warn
          path: |
            /tmp/basketcut-v16/out/v16_proxy_report.json
            /tmp/basketcut-v16/out/nginx_runtime/logs/error.log
            /tmp/basketcut-v16/out/nginx_runtime/logs/access.log

  admission-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Django
        run: python -m pip install -r requirements.txt
      - name: Execute full-game admission rejection tests
        run: |
          python manage.py test highlights.test_v16_real_match_gate --verbosity 2
          mkdir -p /tmp/basketcut-v16-admission
          printf '%s\n' \
            '{"schema_version":1,"games":[{"id":"repeated_short_clip","synthetic":true,"looped":true}]}' \
            > /tmp/basketcut-v16-admission/rejected_fixture.json
          python -m highlights.vision.real_match_gate_v16 \
            --manifest /tmp/basketcut-v16-admission/rejected_fixture.json \
            --out /tmp/basketcut-v16-admission/v16_blocked_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/basketcut-v16-admission/v16_blocked_report.json").read_text())
          assert r["outcome"]=="BLOCKED"
          assert r["independent_source_and_rights_validation_completed"] is False
          assert r["basketball_made_shot_accuracy_measured"] is False
          PY
      - name: Upload honest rejection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basketcut-v16-real-match-admission-fail-closed
          retention-days: 7
          if-no-files-found: warn
          path: /tmp/basketcut-v16-admission/v16_blocked_report.json

  source-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build changed-only source ZIP
        run: |
          mkdir -p /tmp/basketcut-v16/patch
          for file in \
            scripts/v16_proxy_probe.py \
            highlights/vision/real_match_gate_v16.py \
            highlights/test_v16_real_match_gate.py \
            .github/workflows/v16-reverse-proxy-and-game-admission.yml \
            docs/V16_PRODUCTION_ACCEPTANCE.md \
            deploy/nginx/basketcut_upload.example.conf; do
            mkdir -p "/tmp/basketcut-v16/patch/$(dirname "$file")"
            cp "$file" "/tmp/basketcut-v16/patch/$file"
          done
          printf '%s\n' \
            '# BasketCut V1.6 changed-only source patch' \
            'Base: V1.5 main. All six files are NEW; no original code overwritten.' \
            'Extract at repository root, preserving relative paths.' \
            'See docs/V16_PRODUCTION_ACCEPTANCE.md for caveats and verification.' \
            > /tmp/basketcut-v16/patch/INSTALL_V16.md
          (cd /tmp/basketcut-v16/patch && zip -qr ../BasketCut_V1_6_PATCH.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: basketcut-v16-changed-only-source-patch
          retention-days: 7
          path: /tmp/basketcut-v16/BasketCut_V1_6_PATCH.zip
