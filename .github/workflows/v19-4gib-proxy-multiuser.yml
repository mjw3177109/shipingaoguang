name: BasketCut V1.9 Actual 4GiB Nginx and Two-User PostgreSQL Uploads

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/v18_gib_http_probe.py"
      - "scripts/v19_parallel_http_probe.py"
      - ".github/workflows/v19-4gib-proxy-multiuser.yml"
      - "docs/V19_4GIB_PROXY_ACCEPTANCE.md"
  push:
    branches: [main]
    paths:
      - "scripts/v18_gib_http_probe.py"
      - "scripts/v19_parallel_http_probe.py"
      - ".github/workflows/v19-4gib-proxy-multiuser.yml"

jobs:
  real-nginx-4gib:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEBUG: "1"
      SECRET_KEY: "v19-isolated-4gib-ci-only"
      DATABASE_URL: "sqlite:////tmp/basketcut-v19/db.sqlite3"
      MEDIA_ROOT: "/tmp/basketcut-v19/media"
      MEDIA_MIN_FREE_BYTES: "134217728"
      MAX_UPLOAD_BYTES: "4294967296"
      OWNER_MAX_RAW_BYTES: "6442450944"
      BASKETCUT_V19_ISOLATED: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install actual nginx ffmpeg gunicorn and Django
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx ffmpeg
          python -m pip install -r requirements.txt -r requirements-cpu.txt
      - name: Verify isolated temporary DB and disk before 4GiB ingress
        run: |
          mkdir -p /tmp/basketcut-v19/media /tmp/basketcut-v19/audit
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python - <<'PY'
          import shutil
          free = shutil.disk_usage("/tmp/basketcut-v19").free
          print("initial_free_bytes", free)
          assert free >= 7*1024**3, "FAIL: Insufficient 7GiB free runner disk"
          PY
      - name: Produce explicitly padded 4GiB synthetic SHORT-video test fixture
        run: |
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=s=640x360:r=15" -t 20 \
            -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p -movflags +faststart \
            /tmp/basketcut-v19/input.mp4
          python - <<'PY'
          from pathlib import Path
          p=Path("/tmp/basketcut-v19/input.mp4")
          assert 100000 < p.stat().st_size < 10*1024**2
          with p.open("ab") as f:
              f.truncate(4*1024**3)
          assert p.stat().st_size == 4294967296
          print("source=short_20second_generated_video_padded_to_4GiB", p.stat().st_size)
          PY
      - name: ACTUAL 4GiB HTTP data through Nginx and Gunicorn; abort and resume
        run: |
          set -o pipefail
          python scripts/v18_gib_http_probe.py \
            --nginx --video /tmp/basketcut-v19/input.mp4 \
            --out /tmp/basketcut-v19/audit \
            2>&1 | tee /tmp/basketcut-v19/audit/transport_progress.log
      - name: Independent strict 4GiB source-to-destination validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("/tmp/basketcut-v19/audit/v19_4gib_nginx_audit.json")
          r=json.loads(path.read_text())
          expected=4*1024**3
          assert r["result"] == "PASS"
          assert r["actual_nginx_reverse_proxy"]
          assert r["nginx_request_buffering"] == "off"
          assert r["actual_total_file_bytes"] == expected
          assert r["actual_http_confirmed_chunk_bytes"] == expected
          assert r["final_server_offset"] == expected
          assert r["maximum_client_memory_chunk_bytes"] <= 8*1024**2
          assert r["nginx_successful_chunk_post_count"] >= 512
          assert r["nginx_access_log_cross_checked"]
          assert r["server_and_client_full_sha256_equal"]
          assert r["stored_file_sha256_verified_again"]
          assert r["real_socket_aborted_in_second_chunk"]
          assert r["double_finish_idempotent"]
          assert not r["reverse_proxy_tls_tested"]
          assert not r["is_real_basketball_full_match"]
          PY
      - name: Upload public-safe aggregate report (NO media or private file paths)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basketcut-v19-actual-4gib-nginx-transport
          retention-days: 7
          if-no-files-found: warn
          path: /tmp/basketcut-v19/audit/v19_4gib_nginx_audit.json

  two-users-postgres-real-http:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: basketcut
          POSTGRES_USER: v19
          POSTGRES_PASSWORD: isolated_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v19 -d basketcut"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DEBUG: "1"
      SECRET_KEY: "v19-ci-parallel-pg-only"
      DATABASE_URL: "postgres://v19:isolated_ci@127.0.0.1:5432/basketcut"
      MEDIA_ROOT: "/tmp/basketcut-v19/parallel-media"
      MEDIA_MIN_FREE_BYTES: "67108864"
      MAX_UPLOAD_BYTES: "4294967296"
      OWNER_MAX_RAW_BYTES: "8589934592"
      BASKETCUT_V19_ISOLATED: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install actual Nginx and FFmpeg for HTTP transport
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx ffmpeg
          python -m pip install -r requirements.txt
      - name: Initialize isolated PostgreSQL and synthesized media
        run: |
          mkdir -p /tmp/basketcut-v19/parallel-media /tmp/basketcut-v19/parallel-audit
          python manage.py migrate --noinput
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=s=640x360:r=15" -t 20 \
            -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p -movflags +faststart \
            /tmp/basketcut-v19/parallel.mp4
          python - <<'PY'
          from pathlib import Path
          p=Path("/tmp/basketcut-v19/parallel.mp4")
          with p.open("ab") as f:
              f.truncate(16*1024**2)
          assert p.stat().st_size == 16*1024**2
          PY
      - name: Real two-user concurrent HTTP ingest via Nginx/Gunicorn/PostgreSQL
        run: |
          python scripts/v19_parallel_http_probe.py \
            --video /tmp/basketcut-v19/parallel.mp4 \
            --out /tmp/basketcut-v19/parallel-audit
      - name: Independently check parallel ownership/hash proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/basketcut-v19/parallel-audit/v19_parallel_postgres_http.json").read_text())
          assert r["result"]=="PASS"
          assert r["separate_authenticated_tenants"] == 2
          assert r["actual_concurrent_clients_peak"] == 2
          assert r["actual_saved_games"] == 2
          assert r["bytes_per_user"] == 16*1024**2
          assert r["total_confirmed_http_bytes"] == 32*1024**2
          assert r["full_sha_and_ownership_verified_each_user"]
          assert r["nginx_chunk_successes"] >= 4
          PY
      - name: Keep no real video in public artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basketcut-v19-2users-postgres-http-ingest
          retention-days: 7
          if-no-files-found: warn
          path: /tmp/basketcut-v19/parallel-audit/v19_parallel_postgres_http.json

  changed-only-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Produce V1.9 changed-only source patch
        run: |
          mkdir -p /tmp/basketcut-v19/patch
          for file in \
            scripts/v18_gib_http_probe.py \
            scripts/v19_parallel_http_probe.py \
            .github/workflows/v19-4gib-proxy-multiuser.yml \
            docs/V19_4GIB_PROXY_ACCEPTANCE.md; do
            mkdir -p "/tmp/basketcut-v19/patch/$(dirname "$file")"
            cp "$file" "/tmp/basketcut-v19/patch/$file"
          done
          printf '%s\n' \
            '# BasketCut V1.9 changed-only patch' \
            'Base: BasketCut V1.8 main.' \
            'Modified: scripts/v18_gib_http_probe.py; remaining 3 files are NEW.' \
            'Extract at repository root and preserve path structure.' \
            'Run both real 4GiB and parallel-upload CI tests.' \
            'No authentic full-match detection measured; read docs/V19_4GIB_PROXY_ACCEPTANCE.md.' \
            > /tmp/basketcut-v19/patch/INSTALL_V19.md
          (cd /tmp/basketcut-v19/patch && zip -qr ../BasketCut_V1_9_PATCH.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: basketcut-v19-changed-only-source-patch
          retention-days: 7
          path: /tmp/basketcut-v19/BasketCut_V1_9_PATCH.zip
