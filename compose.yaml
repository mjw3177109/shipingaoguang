services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-basketcut}
      POSTGRES_USER: ${POSTGRES_USER:-basketcut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-basketcut} -d ${POSTGRES_DB:-basketcut}"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-basketcut}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-basketcut}
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn basketcut.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 180"
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-basketcut}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-basketcut}
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command:
      - python
      - manage.py
      - runworker
      - --stale-after
      - ${WORKER_STALE_AFTER_SECONDS:-900}
      - --max-recoveries
      - ${WORKER_MAX_RECOVERIES:-2}
volumes:
  pgdata:
  media:
