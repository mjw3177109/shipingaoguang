# Example ONLY: put behind a correctly configured TLS reverse proxy.
# Do not use an unauthenticated public port 80 as your only transport.
# Set the URL and size limits consistently with Django MAX_UPLOAD_BYTES.
# Verify Nginx client temp volume, timeout and worker capacity in production.
upstream basketcut_django {
    server web:8000;
    keepalive 8;
}
server {
    listen 8080;
    server_name _;
    client_max_body_size 4098m;
    client_body_timeout 3600s;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://basketcut_django;
    }
    location /games/upload/ {
        # This prevents a separate full Nginx request-body copy in most
        # deployments; Django/Gunicorn can still write their own temp data.
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://basketcut_django;
    }
}
