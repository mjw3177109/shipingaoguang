{% extends 'base.html' %}{% block title %}登录 · BasketCut{% endblock %}
{% block body %}<div class="login-wrap"><section class="panel"><div class="eyebrow">场馆管理后台</div><h1>登录 BasketCut</h1>
<p class="muted">篮球赛事的上传、审片与精彩集锦交付。</p>
{% if form.errors %}<p class="error-text">用户名或密码不正确。</p>{% endif %}
<form method="post" class="stack">{% csrf_token %}
<label>用户名<input name="username" autocomplete="username" required autofocus></label>
<label>密码<input type="password" name="password" autocomplete="current-password" required></label>
<input type="hidden" name="next" value="{{ next }}">
<button type="submit" class="primary">登录工作台</button></form>
<p class="hint">首位管理员使用 <code>python manage.py createsuperuser</code> 创建。公开注册暂未开放。</p>
</section></div>{% endblock %}
